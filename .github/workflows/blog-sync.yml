name: Blog sync

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install cwebp / imagemagick / ffmpeg (image + video pipeline deps)
        run: sudo apt-get update && sudo apt-get install -y webp imagemagick ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run blog sync (estate sales + shop + YouTube RSS + AM Northwest)
        run: node tools/generate-blog-posts.mjs

      - name: Commit and push any new/changed posts
        run: |
          git config user.name "gg-blog-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/posts assets/images/blog assets/videos/blog tools/blog-sync-checkpoint.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Blog sync: auto-generated posts $(date -u +%Y-%m-%d)"
            git push
          fi
