name: Blog sync

# Runs hourly so a new estate sale can be caught and (per PUSH_POLICY.md)
# pushed the same hour it appears, and so the 9am-Pacific batch push lands
# within the hour regardless of DST -- but syncing/committing every hour
# does NOT mean deploying every hour. See PUSH_POLICY.md / push-gate.mjs:
# whether this run actually pushes (and so actually costs Netlify a
# production-deploy credit) is decided separately from whether it commits.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install cwebp / imagemagick / ffmpeg (image + video pipeline deps)
        run: sudo apt-get update && sudo apt-get install -y webp imagemagick ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run content sync (estate sales + shop + YouTube RSS + AM Northwest)
        run: node tools/generate-blog-posts.mjs

      - name: Commit any new/changed content (does not push -- see push-gate step)
        run: |
          git config user.name "gg-blog-sync-bot"
          git config user.email "actions@users.noreply.github.com"
          git add blog/posts assets/images/blog assets/videos/blog estate-sales assets/images/estate-sales tools/blog-sync-checkpoint.json
          if git diff --cached --quiet; then
            echo "No content changes to commit."
          else
            git commit -m "Content sync: auto-generated updates $(date -u +%Y-%m-%d)"
          fi

      - name: Push-gate (throttles deploys per PUSH_POLICY.md)
        run: node tools/push-gate.mjs
